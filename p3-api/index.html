<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClimaTec – ViajaPerú</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}
    #estado{min-height:1.2em} .error{color:#b00020}
    table{border-collapse:collapse;margin-top:.5rem} td,th{border:1px solid #999;padding:.3rem .6rem}
    pre{background:#f4f4f4;padding:.5rem;overflow:auto}
  </style>
</head>
<body>
  <h1>ClimaTec</h1>
  <form id="form-clima">
    <input id="ciudad" placeholder="Ciudad (ej. Cusco)">
    <button id="btn-buscar" type="submit">Buscar</button>
  </form>
  <p id="estado"></p>
  <div id="resultado"></div>

  <h2>Mediciones (Lima, Cusco, Arequipa)</h2>
  <button id="btn-medir">Medir secuencial vs Promise.all (3 veces)</button>
  <div id="tabla-tiempos"></div>

  <h2>Promise.allSettled con una ciudad inválida</h2>
  <button id="btn-settled">Probar Lima, Cusco, Xyzabc</button>
  <pre id="salida-settled"></pre>

  <script src="app.js"></script>
</body>
</html>
