<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaféTec – Módulos ES</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}
    form{display:flex;gap:.5rem;flex-wrap:wrap}
    li{display:flex;gap:.5rem;align-items:center;margin:.3rem 0}
    li.entregado span{text-decoration:line-through;color:#777}
    #mensaje{color:#b00020;min-height:1.2em}
  </style>
</head>
<body>
  <h1>CaféTec – Módulos ES</h1>
  <form id="form-pedido" novalidate>
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>
  <p id="mensaje"></p>
  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>
  <ul id="lista-pedidos"></ul>
  <p id="total"></p>
  <script type="module" src="main.js"></script>
</body>
</html>
